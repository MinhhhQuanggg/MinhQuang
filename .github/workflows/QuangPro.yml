name: Deploy to DevOps Classroom

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Call deploy webhook
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          set -euo pipefail

          REPO="docker push mquanggg/deploy:tagname"
          CONTAINER_PORT=80

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "${DEPLOY_URL}?repo=${REPO}&tag=latest&slot=1&container_port=${CONTAINER_PORT}")
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          CODE=$(printf '%s\n' "$RESPONSE" | tail -n1)

          echo "Webhook HTTP: $CODE"

          echo "::group::Webhook response"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
          echo "::endgroup::"

          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Deploy failed."
            exit 1
          fi

          echo "Deploy successful."
